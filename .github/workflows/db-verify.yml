name: DB verify (migrations + RLS + pgTAP + lint)

# Owning phase: platform-release (phase 8).
# Merge gate for the Supabase data layer: proves the forward-only migration chain
# applies from scratch, the schema lints clean, and the pgTAP suites pass on a
# real Postgres 15 instance. Blocks client-engineering (roadmap WORK-018 / SEC-C1
# / BD-C1) until green.
#
# NOTE (2026-09-02): this gate is expected to be RED until the following, routed
# to their owners, are fixed and re-verified:
#   * F-5  security-identity  — _week_start_for(date,integer) does not exist
#                               (migration 20260902090006; recompute path throws)
#   * F-2  backend-data-engineering / security-identity — sync_apply INSERT
#                               fails NOT NULL on defaulted columns absent from a
#                               partial payload; RPC leaks a raw exception
#   * F-3/F-4/F-6  security-identity — pgTAP suite 01 assertion-matcher + plan
#                               count corrections
# See docs/platform/platform-release.md §"Verification".

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/db-verify.yml"
  # `db-verify` is a REQUIRED status check on `main` with a strict (up-to-date)
  # policy. A path filter here would leave the check "Expected — waiting" and
  # block merge on any PR that doesn't touch supabase/** (e.g. a client PR).
  # Run it on every PR so the required-check surface is always reported. This is
  # a non-weakening change (same gate, run more often) — routed to
  # `platform-release` for ratification (owner of this workflow / TASK-7 / C-1).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.67.1

      - name: Start local database
        run: supabase db start

      - name: Apply migration chain from scratch (+ seed)
        run: supabase db reset --local

      - name: Lint schema (fail on error)
        run: supabase db lint --local --level warning --fail-on error

      - name: Run pgTAP suites (supabase/tests/01..04)
        run: supabase test db

      # ISS-29 (DEC-55, 2026-09-04): sync_apply's optimistic-concurrency check
      # was a TOCTOU race under true concurrent writers, only reproducible via
      # genuinely concurrent requests — a single-threaded pgTAP script can't
      # exercise this, so it's gated here instead, against the SAME local
      # Postgres this job already started. "Random repeated runs alone are
      # insufficient" (DEC-55) — this asserts the exact invariant broken by
      # the old migration (exactly one applied / one conflict / one version
      # increment), not just "it passed this time."
      - name: Set up Node for the ISS-29 concurrency regression + WORK-013 harnesses
        uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js's RealtimeClient requires a native WebSocket
          # implementation, only built into Node 22+ (Node 20 throws
          # "native WebSocket not found" the moment createClient() runs).
          node-version: 22

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: ISS-29 concurrency regression (ADR-0009 gap) — two-session sync_apply race
        working-directory: client
        run: npx jest --config jest.hosted.config.cjs sync-apply-concurrency

      - name: WORK-013 late-transaction-commit reconciliation (session-capable local Postgres harness)
        working-directory: client
        run: npx jest --config jest.hosted.config.cjs late-commit-reconciliation

      - name: WORK-013 same-timestamp page boundary at the real PAGE=200 size
        working-directory: client
        run: npx jest --config jest.hosted.config.cjs page-boundary-200

      - name: Stop database
        if: always()
        run: supabase stop --no-backup
